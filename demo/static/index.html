<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VPN 样本看板</title>
<style>
  :root{
    --bg:#0f1114; --panel:#161a1f; --line:#242a31; --ink:#e6e9ec;
    --dim:#8b949e; --accent:#4ea1ff; --ok:#3fb950; --bad:#f85149; --warn:#d29922;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:13px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  header{padding:18px 24px;border-bottom:1px solid var(--line);display:flex;
         align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:15px;font-weight:600;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:12px}
  main{padding:20px 24px;max-width:1280px;margin:0 auto}
  section{margin-bottom:26px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--dim);
     margin:0 0 10px;font-weight:600}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
  .card h3{margin:0 0 2px;font-size:13px;font-weight:600}
  .pkg{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--accent);
       word-break:break-all}
  .kv{display:grid;grid-template-columns:68px 1fr;gap:2px 10px;margin-top:10px;font-size:12px}
  .kv dt{color:var(--dim)}
  .kv dd{margin:0;word-break:break-word}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;font-size:11px;text-transform:uppercase;letter-spacing:.8px}
  tbody tr:hover{background:#1a1f26}
  .mono{font-family:ui-monospace,Consolas,monospace}
  .pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;border:1px solid var(--line)}
  .ok{color:var(--ok);border-color:#1f4d28;background:#0d2413}
  .bad{color:var(--bad);border-color:#5a1f1d;background:#2a1211}
  .warn{color:var(--warn);border-color:#4a3a12;background:#241d09}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  button{background:#1f2630;color:var(--ink);border:1px solid var(--line);
         padding:6px 14px;border-radius:6px;font-size:12px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.45;cursor:default}
  input{background:#12161b;border:1px solid var(--line);color:var(--ink);
        padding:6px 10px;border-radius:6px;font-size:12px;width:190px}
  .stat{display:flex;gap:22px;margin:10px 0;flex-wrap:wrap}
  .stat div{font-size:12px;color:var(--dim)}
  .stat b{display:block;font-size:20px;color:var(--ink);font-weight:600}
  .empty{color:var(--dim);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
  code{background:#12161b;padding:1px 5px;border-radius:4px;font-size:11px}
</style>
</head>
<body>
<header>
  <h1>VPN 样本 · 分析与压测台</h1>
  <span class="sub" id="health">连接中…</span>
  <span class="sub">127.0.0.1:9099 · 不接管系统代理</span>
</header>
<main>
  <section>
    <h2>样本总览</h2>
    <div class="cards" id="cards"></div>
  </section>

  <section>
    <h2>端点探测</h2>
    <div class="toolbar">
      <button id="btnProbe">跑一轮探测</button>
      <span class="sub" id="probeAt"></span>
    </div>
    <div class="stat" id="probeStat"></div>
    <table>
      <thead><tr><th>主机</th><th>样本</th><th>用途</th><th>置信</th><th>TCP</th><th>TLS</th><th>延迟</th></tr></thead>
      <tbody id="eps"></tbody>
    </table>
  </section>

  <section>
    <h2>代理池压测</h2>
    <div class="toolbar">
      <input id="target" value="www.gstatic.com:443" title="目标 host:port">
      <input id="conc" value="8" title="并发" style="width:70px">
      <input id="rounds" value="1" title="轮数" style="width:70px">
      <button id="btnStress">开始压测</button>
      <span class="sub" id="poolInfo"></span>
    </div>
    <div class="stat" id="stressStat"></div>
    <div id="stressBody"></div>
  </section>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));

async function jget(u){ const r = await fetch(u); return r.json(); }
async function jpost(u, body){ const r = await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body||{})}); return r.json(); }

async function waitJob(id){
  for(;;){
    const j = await jget("/api/jobs/"+id);
    if(j.state === "done") return j.result;
    await new Promise(r=>setTimeout(r,600));
  }
}

function card(s){
  return `<div class="card">
    <h3>${esc(s.label)}</h3>
    <div class="pkg">${esc(s.package)} ${esc(s.versionName)}</div>
    <dl class="kv">
      <dt>引擎</dt><dd>${esc((s.engines||[]).join(" · "))}</dd>
      <dt>保护</dt><dd>${esc(s.protection)}</dd>
      <dt>节点源</dt><dd>${esc(s.node_source)}</dd>
      <dt>本轮结论</dt><dd>${esc(s.verdict)}</dd>
    </dl>
  </div>`;
}

async function loadOverview(){
  const o = await jget("/api/overview");
  $("#cards").innerHTML = (o.samples||[]).map(card).join("") || "<div class='empty'>无数据</div>";
}

async function loadEndpoints(){
  const d = await jget("/api/endpoints");
  const probes = d.probes;
  const byHost = {};
  if(probes) for(const r of probes.results) byHost[r.host] = r;
  $("#eps").innerHTML = d.endpoints.map(e=>{
    const p = byHost[e.host];
    const tcp = p ? (p.tcp ? `<span class="pill ok">通 ${p.tcp_ms}ms</span>` : `<span class="pill bad">不通</span>`) : `<span class="pill">未测</span>`;
    const tls = p ? (p.tls ? `<span class="pill ok">${esc(p.tls)}</span>` : `<span class="pill bad">${esc((p.error||"失败").slice(0,28))}</span>`) : `<span class="pill">—</span>`;
    return `<tr><td class="mono">${esc(e.host)}</td><td class="mono">${esc(e.sample)}</td>
      <td>${esc(e.role)}</td><td><span class="pill ${e.confidence==="high"?"ok":e.confidence==="excluded"?"bad":"warn"}">${esc(e.confidence)}</span></td>
      <td>${tcp}</td><td>${tls}</td><td class="mono">${p?p.tcp_ms+" ms":"—"}</td></tr>`;
  }).join("");
  if(probes){
    $("#probeAt").textContent = "上次探测 " + probes.at;
    $("#probeStat").innerHTML =
      `<div><b>${probes.total}</b>端点</div><div><b>${probes.tcp_ok}</b>TCP 可达</div><div><b>${probes.tls_ok}</b>TLS 握手成功</div>`;
  }
}

async function loadPool(){
  const d = await jget("/api/pool");
  $("#poolInfo").textContent = d.count ? `池内 ${d.count} 条 socks5` : "池内暂无节点";
  if(d.stress) renderStress(d.stress);
}

function renderStress(s){
  if(!s || !s.attempts){ $("#stressBody").innerHTML = `<div class="empty">${esc(s?.note || "尚未压测")}</div>`; return; }
  $("#stressStat").innerHTML =
    `<div><b>${s.entries}</b>节点</div><div><b>${s.attempts}</b>次探测</div>` +
    `<div><b>${s.success_rate}%</b>成功率</div><div><b>${s.avg_ms ?? "—"}</b>平均延迟 ms</div>`;
  $("#stressBody").innerHTML = `<table><thead><tr><th>代理</th><th>结果</th><th>延迟</th><th>错误</th></tr></thead><tbody>` +
    s.results.map(r=>`<tr><td class="mono">${esc(r.proxy)}</td>
      <td>${r.ok?'<span class="pill ok">通</span>':'<span class="pill bad">失败</span>'}</td>
      <td class="mono">${r.ms} ms</td><td class="mono">${esc(r.err)}</td></tr>`).join("") + "</tbody></table>";
}

$("#btnProbe").onclick = async ()=>{
  $("#btnProbe").disabled = true;
  const {job} = await jpost("/api/probe");
  await waitJob(job);
  await loadEndpoints();
  $("#btnProbe").disabled = false;
};

$("#btnStress").onclick = async ()=>{
  $("#btnStress").disabled = true;
  const {job} = await jpost("/api/stress", {
    target: $("#target").value.trim(),
    concurrency: Number($("#conc").value) || 8,
    rounds: Number($("#rounds").value) || 1
  });
  const r = await waitJob(job);
  renderStress(r);
  if(!r || !r.attempts) $("#stressBody").innerHTML = `<div class="empty">${esc(r?.note||"池内暂无节点")}</div>`;
  $("#btnStress").disabled = false;
};

(async ()=>{
  try{
    const h = await jget("/api/health");
    $("#health").textContent = "后端在线 · pid " + h.pid;
  }catch(e){ $("#health").textContent = "后端离线"; }
  await loadOverview();
  await loadEndpoints();
  await loadPool();
})();
</script>
</body>
</html>
